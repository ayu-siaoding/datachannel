name: Daily market scans

on:
  schedule:
    # 美东 08:30 盘前
    - cron: "30 12 * * 1-5"
    # 美东 09:35 开盘后
    - cron: "35 13 * * 1-5"
    # 美东 12:00 午间
    - cron: "0 16 * * 1-5"
    # 美东 14:00 午后
    - cron: "0 18 * * 1-5"
    # 美东 16:00 尾盘前
    - cron: "0 20 * * 1-5"
    # 美东 ~17:05 收盘后（GEX + 期权异动）
    - cron: "5 21 * * 1-5"
    # 北京约 15:15 A股收盘后（中证800开关 + A股扫描）
    - cron: "15 7 * * 1-5"
  workflow_dispatch:

jobs:
  gex-heatmap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas yfinance

      - name: Run GEX heatmap (SPX)
        run: python3 scripts/gex_heatmap_daily.py --json

      - name: Run SPX/SPY daily level chains
        run: python3 scripts/spx_spy_levels_daily.py --json

      - name: Commit GEX alerts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/alerts/gex_heatmap_* scripts/alerts/spx_spy_levels_*
          if git diff --staged --quiet; then
            echo "No GEX changes."
          else
            git commit -m "chore(alerts): GEX heatmap snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

  options-unusual:
    if: github.event.schedule == '5 21 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas yfinance

      - name: Run options unusual scan
        run: python3 scripts/options_unusual_daily.py --json

      - name: Light comm dual scan + 究公司
        run: |
          python3 scripts/screen_light_comm_dual.py --json
          python3 scripts/screen_us_tonight.py --json || true

      - name: Commit options alerts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/alerts/options_unusual_* scripts/alerts/light_comm_dual_* scripts/alerts/jiu_company_* scripts/alerts/screen_us_tonight_*
          if git diff --staged --quiet; then
            echo "No close-scan changes."
          else
            git commit -m "chore(alerts): close scans + 究公司 $(date -u +%Y-%m-%d)"
            git push
          fi

  ashare-csi800:
    # 北京约 15:15（A股收盘后）+ 手动
    if: github.event.schedule == '15 7 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy yfinance

      - name: CSI800 regime + A-share tonight
        run: |
          python3 scripts/csi800_regime_daily.py --json
          python3 scripts/screen_ashare_tonight.py --json

      - name: Commit A-share alerts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/alerts/csi800_regime_* scripts/alerts/screen_ashare_tonight_*
          if git diff --staged --quiet; then
            echo "No A-share changes."
          else
            git commit -m "chore(alerts): CSI800 switch + A-share screen $(date -u +%Y-%m-%d)"
            git push
          fi

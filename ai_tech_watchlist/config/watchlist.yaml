        name: Uber
        role: 自动驾驶运营
        notes: 题材联动

  infrastructure:
    core:
      - symbol: SOXX.US
        name: 半导体 ETF (iShares)
        role: 半导体 beta
        notes: Delta 对冲；板块温度计
      - symbol: QQQ.US
        name: 纳指100 ETF
        role: 科技大盘 beta
        notes: PCR/IV 观测
      - symbol: SMH.US
        name: 半导体 ETF (VanEck)

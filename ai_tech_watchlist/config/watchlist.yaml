      - symbol: MU.US
        name: 美光
        role: HBM/存储
        notes: 周期+AI 双属性

  model_platform:
    core:
      - symbol: MSFT.US
        name: 微软
        role: OpenAI 生态 + Azure AI
        notes: 长期 vol 基准；Copilot 指引
      - symbol: GOOGL.US
        name: 谷歌
        role: Gemini + 云
        notes: 搜索/云 AI 资本开支
      - symbol: META.US
        name: Meta
        role: 推荐算法 + Llama
        notes: 广告+AI  capex
      - symbol: AMZN.US
        name: 亚马逊
        role: AWS AI 服务
        notes: Bedrock/Trainium 叙事
    elastic:
      - symbol: PLTR.US
        name: Palantir
        role: AI 应用/政府+企业
        notes: 订单流活跃；情绪标
      - symbol: SNOW.US
        name: Snowflake
        role: 数据+AI 平台
        notes: 财报波动大
      - symbol: CRM.US
        name: Salesforce
        role: 企业 AI Agent
        notes: Einstein 相关指引

  terminal_scenario:
    core:
      - symbol: AAPL.US
        name: 苹果
        role: 端侧 AI / Apple Intelligence
        notes: 秋季发布会窗口
      - symbol: TSLA.US
        name: 特斯拉
        role: 智驾/FSD 叙事
        notes: 高 vol；tsll 类对手逆向重点；期权 PCR 敏感
    elastic:
      - symbol: ISRG.US
        name: Intuitive Surgical
        role: 手术机器人
        notes: AI+医疗场景

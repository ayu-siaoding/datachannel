# ---------------------------------------------------------------------------
# 事件与 NLP（基本面事件埋伏模块引用）
# ---------------------------------------------------------------------------
event_keywords:
  cn:
    - 算力
    - 大模型
    - 人工智能+
    - CPO
    - 光模块
    - 智驾
    - 机器人
    - 国产替代
  us:
    - AI capex
    - data center
    - inference
    - GPU
    - export control
    - Blackwell
    - Copilot
    - FSD

# 关键事件类型（日历模块可对接）
event_types:
  - id: earnings
    label: 财报
    lead_days: 5
  - id: policy
    label: 政策/监管
    lead_days: 3
  - id: product_launch
    label: 产品发布
    lead_days: 7
  - id: fund_disclosure
    label: 基金持仓披露
    lead_days: 2
    notes: Wood/Barron 等；对手逆向重点

# 对手逆向跟踪（帖子→公告 24–48h 回溯）
competitor_signals:
  focus_symbols: [NVDA.US, TSLA.US, SMCI.US, AMD.US, QQQ.US, SOXX.US]
  categories:
    - id: event_ambush
      label: 事件埋伏
    - id: momentum
      label: 动量追价
    - id: vol_bet
      label: vol 赌财报

# 策略 → 默认观察层级映射
strategy_defaults:
  emotion_cycle:
    markets: [cn]
    layers: [compute, terminal_scenario]
    priority: [core]
  event_driven:
    markets: [us, cn]
    layers: [compute, model_platform]
    priority: [core]
  options_iv:
    markets: [us]
    layers: [compute, infrastructure]
    priority: [core]
  order_flow:
    markets: [us]
    layers: [compute, terminal_scenario]
    priority: [core, elastic]
  trend_base:
    markets: [us, cn]
    layers: [model_platform, infrastructure]
    priority: [core]

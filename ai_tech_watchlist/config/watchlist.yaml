# AI 科技观察池 — 分层配置文件
# 用途：统一标的池，对接情绪周期 / 事件埋伏 / 期权 IV / 对手逆向等策略
# 维护：按需增删；priority=core 为流动性与期权链优先标的，elastic 为高弹性机动仓

version: "1.0"
updated: "2026-08-13"
theme: AI 科技

# 产业链分层定义（跨市场通用）
layers:
  compute:
    label: 算力
    description: GPU、服务器、光模块、交换芯片、IDC
    strategy_fit: [event_driven, options_iv, order_flow, emotion_dragon]
  model_platform:
    label: 模型与平台
    description: 大模型、云计算、AI 中间件
    strategy_fit: [event_driven, nlp_news, trend_base]
  terminal_scenario:
    label: 终端与场景
    description: AI 手机/PC、智驾、机器人、AI 应用
    strategy_fit: [emotion_cycle, event_driven, order_flow]
  infrastructure:
    label: 基础设施
    description: 板块 ETF、指数、对冲工具
    strategy_fit: [delta_hedge, pcr_monitor, trend_base]

# ---------------------------------------------------------------------------
# 美股观察池（Longbridge 代码格式：SYMBOL.US）
# ---------------------------------------------------------------------------
us:
